name: bulk-cook-planner

services:
  llm:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    ports:
      - "127.0.0.1:${LLM_PORT:-8081}:8080"
    environment:
      - LLAMA_CACHE=/models
    volumes:
      - /models:/models
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      start_period: 30m
      start_interval: 5s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    command: >
      --hf-repo ggml-org/gpt-oss-20b-GGUF
      --hf-file gpt-oss-20b-MXFP4.gguf
      -ngl 99
      -np 1
      -c 32768
      -fa on
      --jinja
      --host 0.0.0.0
      --port 8080

  # Each service keeps its files on disk under VOLUMES_DIR (default ./volumes,
  # which git ignores), in a folder named after the service. They survive
  # `docker compose down -v` and can be copied to another machine (stop the
  # service first).
  graphdb:
    image: neo4j:5-community
    user: "${DOCKER_UID:-1000}:${DOCKER_GID:-1000}"
    ports:
      - "127.0.0.1:${GRAPH_HTTP_PORT:-7474}:7474"
      - "127.0.0.1:${GRAPH_BOLT_PORT:-7687}:7687"
    environment:
      - NEO4J_AUTH=none
      - NEO4J_server_memory_heap_max__size=1G
    volumes:
      - ${VOLUMES_DIR:-./volumes}/graphdb/data:/data
      - ${VOLUMES_DIR:-./volumes}/graphdb/logs:/logs
      - ${VOLUMES_DIR:-./volumes}/graphdb/import:/import:ro
