name: bulk-cook-planner

services:
  llm:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    ports:
      - "8081:8080"
    environment:
      - LLAMA_CACHE=/models
    volumes:
      - /models:/models
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      start_period: 30m
      start_interval: 5s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    command: >
      --hf-repo ggml-org/gpt-oss-20b-GGUF
      --hf-file gpt-oss-20b-MXFP4.gguf
      -ngl 99
      -np 1
      -c 32768
      -fa on
      --jinja
      --host 0.0.0.0
      --port 8080


  graphdb:
    image: neo4j:5-community
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=none
      - NEO4J_server_memory_heap_max__size=1G
    volumes:
      - ./volumes/graphdb/data:/data
      - ./volumes/graphdb/logs:/logs
      - ./volumes/graphdb/import:/import:ro
