name: bulk-cook-planner

services:
  llm:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    ports:
      - "8081:8080"
    environment:
      - LLAMA_CACHE=/models
    volumes:
      - /models:/models
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      start_period: 30m
      start_interval: 5s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    command: >
      --hf-repo ggml-org/gpt-oss-20b-GGUF
      --hf-file gpt-oss-20b-MXFP4.gguf
      -ngl 99
      -np 1
      -c 32768
      -fa on
      --jinja
      --host 0.0.0.0
      --port 8080


  graphdb:
    image: neo4j:5-community
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=none
      - NEO4J_server_memory_heap_max__size=1G
    volumes:
      - ./volumes/graphdb/data:/data
      - ./volumes/graphdb/logs:/logs
      - ./volumes/graphdb/import:/import:ro

  db:
    image: pgvector/pgvector:pg18
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      - POSTGRES_USER=bulkcook
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD-bulkcook}
      - POSTGRES_DB=bulkcook
    volumes:
      - ./volumes/db:/var/lib/postgresql
    configs:
      - source: create-databases
        target: /docker-entrypoint-initdb.d/create-databases.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -U bulkcook"]
      interval: 5s
      timeout: 3s
      retries: 10

  knowledge:
    build:
      context: .
      dockerfile: knowledge/Dockerfile
    ports:
      - "127.0.0.1:8082:8082"
    environment:
      - NEO4J_URI=bolt://graphdb:7687
    env_file:
      - path: .env
        required: false
    depends_on:
      - graphdb

  optimiser:
    build:
      context: .
      dockerfile: optimiser/Dockerfile
    ports:
      - "127.0.0.1:8083:8083"
    environment:
      - POSTGRES_URL=jdbc:postgresql://db:5432/nutrition
    env_file:
      - path: .env
        required: false
    depends_on:
      db:
        condition: service_healthy

configs:
  # Each service that keeps data has a database of its own. This runs only the
  # first time the db service starts, while volumes/db is still empty.
  create-databases:
    content: |
      CREATE DATABASE nutrition;
