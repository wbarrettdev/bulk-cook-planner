spring:
  application:
    name: knowledge
  ai:
    mcp:
      server:
        name: knowledge
        version: 0.1.0
        protocol: STREAMABLE
  neo4j:
    uri: ${NEO4J_URI:bolt://localhost:7687}
    max-transaction-retry-time: 5s

server:
  port: 8082

pairing:
  rules:
    go-easy-penalty: 2
    basics:
      - salt
      - pepper
      - black pepper
      - white pepper
      - oil
      - olive oil
      - vegetable oil
      - stocks
      - stock
      - water
      - sugar
