spring.application.name=knowledge
server.port=8082

spring.ai.mcp.server.name=knowledge
spring.ai.mcp.server.version=0.1.0
spring.ai.mcp.server.protocol=STREAMABLE

spring.neo4j.uri=${NEO4J_URI:bolt://localhost:7687}
spring.neo4j.max-transaction-retry-time=5s

pairing.rules.basics=salt,pepper,black pepper,white pepper,oil,olive oil,vegetable oil,stocks,stock,water,sugar
pairing.rules.go-easy-penalty=2
